StylesPath = ".github/vale/styles"
MinAlertLevel = suggestion
Packages = Google
Vocab = Aiven


[formats]
mdx = md

[*.{md,mdx}]
BlockIgnores = (?s)(^---$.*^---$)
TokenIgnores = (import\s+.*?from\s+['"].*?['"];?)|(`[^`]*`)
BasedOnStyles = Google, Aiven
Google.Acronyms = NO
Google.Contractions = NO
Google.DateFormat = NO
Google.Ordinal = NO
Vale.Spelling = YES
Aiven.DateFormat = YES
Aiven.Headings = NO
Aiven.H2unique = NO

# Agent-facing guidance, not published docs. The style guide deliberately
# contains counter-examples (bad quotes, "e.g.", sample names), so linting
# it is meaningless. Replaces a bogus `IgnoredPatterns` key Vale ignored (W101).
[.ai-agents/**]
BasedOnStyles =

[**/.ai-agents/**]
BasedOnStyles =
