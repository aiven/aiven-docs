name: Test agent friendliness of docs
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  agent-docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 23

      - run: corepack enable
      - run: yarn install --immutable

      - name: Run agent-friendly docs checks
        run: yarn afdocs check --config tests/agent-docs.config.yml
        timeout-minutes: 5
