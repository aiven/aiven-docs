name: Test agent friendliness of docs
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  agent-docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm install

      - name: Run agent-friendly docs checks
        run: npx vitest run tests/agent-docs.test.ts
        timeout-minutes: 5

      - name: Upload AFDocs report and score
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-docs-report
          path: reports/agent-docs/report.json
          if-no-files-found: error
